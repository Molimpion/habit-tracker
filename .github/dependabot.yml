version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - type:chore
      - scope:devops

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - type:chore
      - scope:devops
