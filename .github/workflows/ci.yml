name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varredura de segredos (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Auditoria das dependências de execução (qualquer nível)
        run: npm audit --omit=dev
      - name: Auditoria das dependências de desenvolvimento (alta ou crítica)
        run: npm audit --audit-level=high
